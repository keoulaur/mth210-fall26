<tr>
<td class="l m b1 r0 l0 t0 lines">10 (Distinguished)</td>
<td class="l m b1 r0 l0 t0" style="max-width:570px;">
<div class="para">For completely correct and well written proofs or solutions. Includes:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-4-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Clearly communicated understanding of key ideas.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-4-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Explanations and justifications are complete, correct, and easy to follow.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-4-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Mathematical terminology and notation are used correctly, reasoning flows logically, and adheres to all writing guidelines.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-4-2-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para"><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-4-2-5" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div></div>
</td>
</tr>
<tr>
<td class="l m b1 r0 l0 t0 lines">8 (Proficient)</td>
<td class="l m b1 r0 l0 t0" style="max-width:570px;">
<div class="para">The proof or solution has the main flow of logic correct, but misses one of the high standards of a 10.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-5-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Communication of key ideas is essentially correct but may contain minor flaws that do not subtract significantly from the solution.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-5-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Explanations and justifications are essentially complete, correct, and can be followed, but may contain minor errors that subtract, but not significantly, from the solution.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-5-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Reasoning flows logically, Mathematical terminology and notation are used at least mostly correctly, adheres to at least most of our writing guidelines.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-5-2-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>
</tr>
<tr>
<td class="l m b1 r0 l0 t0 lines">6 (Progressing significantly)</td>
<td class="l m b1 r0 l0 t0" style="max-width:570px;">
<div class="para">A 6 is earned for proofs or solutions that show significant progress towards a solution, but have a key error.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-6-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Communication contains many of the key ideas but also may contain errors that subtract significantly from the solution.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-6-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Explanations and justifications exist, but are not always clear and easy to follow or they do not match the work done.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-6-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Mathematical terminology and notation are at least sometimes used correctly and ddheres to at least some of the writing guidelines.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-6-2-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Work done has some logical foundation, but flow of ideas may not easily be followed. Or there is a computation that contains an error that subtracts significantly from the solution.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-6-2-5" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>
</tr>
<tr>
<td class="l m b1 r0 l0 t0 lines">3 (Progressing)</td>
<td class="l m b1 r0 l0 t0" style="max-width:570px;">
<div class="para">A 3 is earned for proofs or solutions that have the basics, but have a major flaw that make it invalid.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-7-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Communication demonstrates understanding of some key ideas, but also demonstrates a lack of understanding of other ideas.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-7-2-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Some claims have sufficient explanations or justifications, but some are missing entirely or are hard to follow, or there may be a significant logical error, or The solution is disorganized or contains irrelevant information or arguments.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-7-2-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">Mathematical terminology or notation may be nonsensical or incorrectly used but adheres to at least a few of the writing guidelines.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-7-2-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>
</tr>
<tr>
<td class="l m b3 r0 l0 t0 lines">0 (Inadequate)</td>
<td class="l m b3 r0 l0 t0" style="max-width:570px;">
<div class="para">A 0 is given to a proof or solution that is invalid (due to logic or being not understandable to the reader). Or the proof is work that is not your own.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#grading-rubric-2-8-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>
